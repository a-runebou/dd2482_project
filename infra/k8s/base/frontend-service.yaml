# The static bundle. The Ingress routes everything except /api here. ClusterIP only; outside
# traffic arrives through the Ingress.
apiVersion: v1
kind: Service
metadata:
  name: frontend
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: schedular
    app.kubernetes.io/component: frontend
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
