services:
  postgres:
    image: postgres:16

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U schedular -d schedular"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest

    ports:
      - "1025:1025"
      - "8025:8025"

  migrate:
    build:
      context: ../../backend
      dockerfile: Dockerfile

    command:
      - alembic
      - upgrade
      - head

    environment:
      DATABASE_URL: postgresql+psycopg://schedular:schedular@postgres:5432/schedular
      ENVIRONMENT: development
      JWT_SECRET: ${JWT_SECRET}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE}
      BUILD_SHA: ${BUILD_SHA}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USERNAME: ${SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM: ${SMTP_FROM}
      OPS_ALERT_EMAIL: ${OPS_ALERT_EMAIL}

    depends_on:
      postgres:
        condition: service_healthy

    volumes:
      - ../../backend:/app

  backend:
    build:
      context: ../../backend
      dockerfile: Dockerfile

    depends_on:
      migrate:
        condition: service_completed_successfully
      mailpit:
        condition: service_started
      worker:
        condition: service_started

    environment:
      DATABASE_URL: postgresql+psycopg://schedular:schedular@postgres:5432/schedular
      ENVIRONMENT: development
      JWT_SECRET: ${JWT_SECRET}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE}
      BUILD_SHA: ${BUILD_SHA}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USERNAME: ${SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM: ${SMTP_FROM}
      OPS_ALERT_EMAIL: ${OPS_ALERT_EMAIL}

    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"

    volumes:
      - ../../backend:/app

  worker:
    build:
      context: ../../backend
      dockerfile: Dockerfile

    command:
      - python
      - -m
      - app.worker.main

    environment:
      DATABASE_URL: postgresql+psycopg://schedular:schedular@postgres:5432/schedular
      ENVIRONMENT: development
      JWT_SECRET: ${JWT_SECRET}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE}
      BUILD_SHA: ${BUILD_SHA}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USERNAME: ${SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM: ${SMTP_FROM}
      OPS_ALERT_EMAIL: ${OPS_ALERT_EMAIL}

    depends_on:
      migrate:
        condition: service_completed_successfully
      mailpit:
        condition: service_started

    volumes:
      - ../../backend:/app

  frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile

    depends_on:
      backend:
        condition: service_started

    environment:
      BACKEND_ORIGIN: http://backend:8000

    ports:
      - "8080:8080"

volumes:
  postgres_data: