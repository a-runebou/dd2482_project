# The single origin (ARCHITECTURE section 10, coordination C1/C9): one host, split by path at the
# ingress. /api goes straight to the backend rather than through the frontend's nginx proxy, so
# nginx serves only the bundle for traffic that arrives here.
#
# No host: each overlay adds its own with a patch, so the base carries no environment's name.
# Prefix matches whole path segments, so /api matches /api/v1/config but not /apiary.
#
# Standard networking.k8s.io Ingress only, no Traefik CRDs, so the manifest stays portable across
# whichever cluster production lands on.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: schedular
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 8080
