# Let's Encrypt production: browser-trusted certificates, strict rate limits. Selected only after
# letsencrypt-staging has issued for the same host (docs/deployment/runbook.md).
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      - http01:
          ingress:
            ingressClassName: traefik
