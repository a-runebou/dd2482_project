[project]
name = "schedular-backend"
version = "0.1.0"
description = "Backend for the Schedular group scheduling application"
requires-python = ">=3.12"

dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic>=2",
    "sqlalchemy>=2",
    "psycopg[binary]",
    "alembic",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "httpx",
    "ruff",
    "mypy",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
