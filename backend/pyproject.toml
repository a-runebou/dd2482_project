[project]
name = "schedular-backend"
version = "0.1.0"
description = "Backend for the Schedular group scheduling application"
requires-python = ">=3.12"

dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic>=2",
    "sqlalchemy>=2",
    "psycopg[binary]",
    "alembic",
    "email-validator>=2.2,<3",
    "uuid6>=2024.7",
    "PyJWT>=2.9,<3",
    "icalendar>=6,<7",
    "python-dateutil>=2.9,<3",
    "python-multipart>=0.0.9,<1",
    "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "httpx",
    "ruff",
    "mypy",
    "types-icalendar",
    "types-python-dateutil",
    "PyYAML>=6,<7",
    "openapi-spec-validator>=0.7,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["alembic*"]

[tool.ruff.lint]
ignore = ["B008"]