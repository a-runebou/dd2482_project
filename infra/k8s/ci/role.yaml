# Exactly what `deploy-prod.sh release` does in namespace schedular, call by call, and nothing
# else. Derived from the script and the rendered prod-migrate and prod overlays (Job, ConfigMap,
# Service, Deployment, Ingress, NetworkPolicy). If the script or the overlays gain a call or a
# kind, this Role has to follow, or the release fails with Forbidden.
#
# Deliberately absent: Secrets in any form, pods/exec, pods/attach, pods/portforward, Roles,
# RoleBindings, ServiceAccounts, every wildcard, and anything outside the namespace. Client-side
# apply needs get, create and patch; never update or list on what it applies.
#
# Not a boundary this Role can draw: whoever may create or patch a Deployment or Job here can run
# a pod that mounts any Secret in the namespace. The credential is therefore as sensitive as the
# application's own Secrets (runbook, "Automated deployment (prepared, not active)").
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: github-deployer
  labels:
    app.kubernetes.io/name: schedular
    app.kubernetes.io/component: ci-deployer
rules:
  # Applied with the application. The generated ConfigMap gets a new name per release, hence
  # create; an unchanged one is patched.
  - apiGroups: [""]
    resources: [configmaps, services]
    verbs: [get, create, patch]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses, networkpolicies]
    verbs: [get, create, patch]
  # apply, the revision read before it, rollout status (list and watch) and rollout undo (patch).
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, list, watch, create, patch]
  # rollout undo finds the target revision among the Deployment's ReplicaSets.
  - apiGroups: [apps]
    resources: [replicasets]
    verbs: [get, list]
  # rollout status statefulset/postgres before migrating.
  - apiGroups: [apps]
    resources: [statefulsets]
    verbs: [get, list, watch]
  # The migrate Job: deleted with --wait (get, list, watch), applied, polled, described.
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [get, list, watch, create, patch, delete]
  # Diagnostics on failure: pods by label, their logs and events. Read-only.
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
  - apiGroups: [""]
    resources: [events]
    verbs: [get, list]
