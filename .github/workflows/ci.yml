name: ci

on:
  push:
    branches:
      - develop
      - feat/dev-deployment
    paths:
      - "backend/**"
      - "frontend/**"
      - "contracts/**"
      - "infra/compose/**"
      - ".github/workflows/**"

  pull_request:
    paths:
      - "backend/**"
      - "frontend/**"
      - "contracts/**"
      - "infra/compose/**"
      - ".github/workflows/**"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    uses: ./.github/workflows/backend-ci.yml

  frontend:
    uses: ./.github/workflows/frontend-ci.yml

  test-pi-runner:
    runs-on:
      - self-hosted
      - Linux
      - ARM64
      - dev-deployment

    steps:
      - name: Test Raspberry Pi runner
        run: |
          echo "Hello from Raspberry Pi"
          hostname
          uname -m
          docker --version
          docker compose version