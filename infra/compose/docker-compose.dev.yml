services:
  backend:
    build:
      context: ../../backend
      dockerfile: Dockerfile

    depends_on:
      - postgres

    environment:
      DATABASE_URL: postgresql+psycopg://schedular:schedular@postgres:5432/schedular
      ENVIRONMENT: development
      JWT_SECRET: ${JWT_SECRET}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE}
      BUILD_SHA: ${BUILD_SHA}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USERNAME: ${SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM: ${SMTP_FROM}
      OPS_ALERT_EMAIL: ${OPS_ALERT_EMAIL}

    volumes:
      - ../../backend:/app

  frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile

    depends_on:
      - backend

    environment:
      BACKEND_ORIGIN: http://backend:8000

    ports:
      - "8080:8080"

  postgres:
    image: postgres:16

    environment:
      POSTGRES_DB: schedular
      POSTGRES_USER: schedular
      POSTGRES_PASSWORD: schedular

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  worker:
    build:
      context: ../../backend
    command:
      - python
      - -m
      - app.worker.main
    environment:
      ENVIRONMENT: ${ENVIRONMENT}
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USERNAME: ${SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM: ${SMTP_FROM}
      OPS_ALERT_EMAIL: ${OPS_ALERT_EMAIL}
    depends_on:
      - postgres
      - mailpit

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  postgres_data: