# Only the two processes that send mail may reach SMTP, and nothing may reach the UI. Once a pod is
# selected by an ingress policy, everything not listed is denied, so 8025 needs no rule of its own.
#
# kubectl port-forward does not pass through this policy: the kubelet connects inside the pod's
# network namespace. That is the intended way to the UI (see the README), and the reason nothing
# else needs to reach 8025.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mailpit
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: schedular
      app.kubernetes.io/component: mailpit
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - schedular
              - key: app.kubernetes.io/component
                operator: In
                values:
                  - backend
                  - worker
      ports:
        - protocol: TCP
          port: 1025
