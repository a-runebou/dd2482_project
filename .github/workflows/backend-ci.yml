name: backend-ci

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: schedular_ci
          POSTGRES_USER: schedular_ci
          POSTGRES_PASSWORD: schedular_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U schedular_ci -d schedular_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://schedular_ci:schedular_ci@localhost:5432/schedular_ci
      ENVIRONMENT: development
      JWT_SECRET: ci-only-test-secret-at-least-32-bytes
      PUBLIC_APP_URL: http://localhost:5173
      AUTH_COOKIE_SECURE: false
      SMTP_HOST: localhost
      SMTP_PORT: 1025
      SMTP_FROM: schedular-ci@example.test

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - run: python -m pip install -e ".[dev]"
      - run: ruff check app tests
      - run: mypy app
      - run: alembic upgrade head
      - run: alembic check
      - run: pytest