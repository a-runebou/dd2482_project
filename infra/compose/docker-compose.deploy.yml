services:
  postgres:
    image: postgres:16
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10


  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped

    ports:
      - "8025:8025"

    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 5s
      retries: 10


  migrate:
    image: ghcr.io/a-runebou/dd2482_project-backend:${IMAGE_TAG}

    command:
      - alembic
      - upgrade
      - head

    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      ENVIRONMENT: development
      JWT_SECRET: ${JWT_SECRET}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE}
      BUILD_SHA: ${IMAGE_TAG}
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_USERNAME: ${SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM: ${SMTP_FROM}
      OPS_ALERT_EMAIL: ${OPS_ALERT_EMAIL}

    depends_on:
      postgres:
        condition: service_healthy

    restart: "no"


  backend:
    image: ghcr.io/a-runebou/dd2482_project-backend:${IMAGE_TAG}
    restart: unless-stopped

    depends_on:
      migrate:
        condition: service_completed_successfully
      mailpit:
        condition: service_healthy

    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      ENVIRONMENT: development
      JWT_SECRET: ${JWT_SECRET}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE}
      BUILD_SHA: ${IMAGE_TAG}
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_USERNAME: ${SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM: ${SMTP_FROM}
      OPS_ALERT_EMAIL: ${OPS_ALERT_EMAIL}

    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"


  worker:
    image: ghcr.io/a-runebou/dd2482_project-backend:${IMAGE_TAG}
    restart: unless-stopped

    command:
      - python
      - -m
      - app.worker.main

    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      ENVIRONMENT: development
      JWT_SECRET: ${JWT_SECRET}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE}
      BUILD_SHA: ${IMAGE_TAG}
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_USERNAME: ${SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM: ${SMTP_FROM}
      OPS_ALERT_EMAIL: ${OPS_ALERT_EMAIL}

    depends_on:
      migrate:
        condition: service_completed_successfully
      mailpit:
        condition: service_healthy


  frontend:
    image: ghcr.io/a-runebou/dd2482_project-frontend:${IMAGE_TAG}
    restart: unless-stopped

    depends_on:
      backend:
        condition: service_started

    environment:
      BACKEND_ORIGIN: http://backend:8000

    ports:
      - "8080:8080"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q --spider http://127.0.0.1:8080/ || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 5


volumes:
  postgres_data: