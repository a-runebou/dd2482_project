# Traefik settings common to every environment. Chart traefik/traefik 41.6.0, release traefik,
# namespace traefik. Every key here exists in `helm show values traefik/traefik --version 41.6.0`.
# Environment-specific settings go in values-<environment>.yaml, passed after this file.

# Our Ingress names this class explicitly (base/ingress.yaml), so the name is pinned here rather
# than left to the chart's default.
ingressClass:
  enabled: true
  name: traefik

# Routing comes only from standard networking.k8s.io Ingress objects. The IngressRoute (CRD) and
# Gateway API providers are off, so nothing can route through a Traefik-specific object by
# accident. The chart still installs its CRDs; they are simply not watched.
providers:
  kubernetesIngress:
    enabled: true
  kubernetesCRD:
    enabled: false
  kubernetesGateway:
    enabled: false
